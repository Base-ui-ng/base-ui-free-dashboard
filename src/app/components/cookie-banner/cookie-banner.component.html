@if (visible()) {
  <div
    class="pointer-events-auto rounded-xl border border-slate-200 bg-white p-4 shadow-2xl dark:border-slate-700 dark:bg-slate-800"
    role="region"
    aria-label="Cookie consent">
    <div class="mb-3 flex items-start gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-700">
        <base-icon name="cookie" class="h-5 w-5 stroke-slate-600 dark:stroke-slate-300"></base-icon>
      </span>
      <div class="min-w-0">
        <p class="m-0! text-sm font-semibold text-slate-900 dark:text-white">{{ title() }}</p>
        <p class="mt-1 mb-0! text-sm text-slate-600 dark:text-slate-300">{{ message() }}</p>
        @if (policyHref()) {
          <a
            class="mt-2 inline-block text-sm font-medium text-blue-600 hover:underline dark:text-blue-400"
            [href]="policyHref()"
            target="_blank"
            rel="noopener noreferrer">
            {{ policyLabel() }}
          </a>
        }
      </div>
    </div>
    <div class="flex flex-wrap justify-end gap-2">
      <button type="button" base-stroked-button color="default" size="sm" (click)="reject()">
        {{ rejectLabel() }}
      </button>
      <button type="button" base-button color="primary" size="sm" (click)="accept()">
        {{ acceptLabel() }}
      </button>
    </div>
  </div>
}
